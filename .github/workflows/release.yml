name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: La etiqueta coincide con module.json
        run: test "v$(node -p "require('./module.json').version")" = "$GITHUB_REF_NAME"
      - run: node tools/check.mjs
      - run: for f in scripts/*.js; do node --check "$f"; done
      - name: Empaquetar
        run: |
          mkdir -p dist
          zip -r dist/party-corner-portraits-plus.zip module.json README.md CHANGELOG.md lang scripts styles templates
          cp module.json dist/module.json
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" 'index($0, v)==1{p=1;next} /^## /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/party-corner-portraits-plus.zip dist/module.json --title "Party Corner Portraits + $GITHUB_REF_NAME" --notes-file dist/notas.md
